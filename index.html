<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Task Tracker</h1>
      <p class="subtitle">A simple full-stack task management app.</p>

      <form id="taskForm">
        <input id="taskInput" type="text" placeholder="Enter a task..." autocomplete="off">
        <button type="submit">Add Task</button>
      </form>

      <p id="message" class="message"></p>
      <ul id="taskList"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
